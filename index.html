<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreatorFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────── -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-badge">CF</div>
        <span class="logo-text">CreatorFlow</span>
      </div>
      <button class="btn btn-primary" id="btn-add-header" data-testid="button-add-idea-header">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Idea
      </button>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────── -->
  <main>
    <div class="page-header">
      <div>
        <h2 class="page-title">Pipeline</h2>
        <p class="page-subtitle">Organize and track your content creation process.</p>
      </div>
      <div id="tabs" class="tabs" role="tablist"></div>
    </div>

    <div id="card-container"></div>
  </main>

  <!-- ── Modal ──────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">

      <div class="modal-header">
        <h2 id="modal-title">New Video Idea</h2>
      </div>

      <div class="modal-body">
        <form id="idea-form" novalidate>

          <div class="form-group">
            <label for="field-title">Title</label>
            <input
              type="text"
              id="field-title"
              placeholder="e.g. 10 Tips for Better Lighting"
              maxlength="100"
              data-testid="input-title"
            />
            <span class="field-error" id="error-title"></span>
          </div>

          <div class="form-row" style="margin-top: 18px;">
            <div class="form-group">
              <label for="field-status">Status</label>
              <select id="field-status" data-testid="select-status">
                <option value="idea">Idea</option>
                <option value="scripting">Scripting</option>
                <option value="filming">Filming</option>
                <option value="editing">Editing</option>
                <option value="published">Published</option>
              </select>
              <span class="field-error" id="error-status"></span>
            </div>

            <div class="form-group">
              <label for="field-category">Category</label>
              <input
                type="text"
                id="field-category"
                placeholder="e.g. Tutorial"
                maxlength="50"
                data-testid="input-category"
              />
              <span class="field-error" id="error-category"></span>
            </div>
          </div>

          <div class="form-group" style="margin-top: 18px;">
            <label for="field-description">Description (Optional)</label>
            <textarea
              id="field-description"
              placeholder="Key talking points or concepts..."
              maxlength="500"
              data-testid="input-description"
            ></textarea>
            <span class="field-error" id="error-description"></span>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <div>
          <button class="btn btn-danger" id="btn-delete" data-testid="button-delete-idea" style="display:none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Delete
          </button>
        </div>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button class="btn btn-primary" id="btn-save" data-testid="button-save-idea">Create Idea</button>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
